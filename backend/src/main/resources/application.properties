server.port=${PORT:8080}
spring.application.name=rcm-insight-backend

# MongoDB Atlas / Cloud Database Connection (fallback to local for offline dev)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rcm_insight}

# Production Frontend & Local Dev Origins
frontend.url=${FRONTEND_URL:https://rcm-50.vercel.app}

# Python ML Service URL (fallback to local or embedded rule-engine)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.xirotech.rcm=INFO
logging.level.org.springframework.data.mongodb=INFO

# Process Lifecycle Email Notification Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
rcm.mail.from=${MAIL_FROM:notifications@rcminsight.com}
rcm.mail.default-recipient=${DEFAULT_PATIENT_EMAIL:balakrishnana206k@gmail.com}
rcm.mail.enabled=${MAIL_ENABLED:true}


